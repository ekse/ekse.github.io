  type: 'doughnut',
  data: {
    labels: ['With build script', 'Without build script'],
    datasets: [{ data: [126, 874], backgroundColor: ['#0a7d32', '#c9d3dd'] }]
  },
  options: {
    plugins: {
      legend: { position: 'bottom' },
      tooltip: { callbacks: { label: c => c.label + ': ' + c.parsed.toLocaleString() } }
    }
  }
});

const fmt = n => n.toLocaleString();
const tbody = document.getElementById('tbody');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(onlyWith) {
  const rows = onlyWith ? DATA.filter(r => r.uses_build_script) : DATA;
  tbody.innerHTML = rows.map(r => `<tr>
    <td>${escapeHtml(r.name)}</td>
    <td>${escapeHtml(r.version)}</td>
    <td class="num">${fmt(r.downloads)}</td>
    <td class="${r.uses_build_script ? 'yes' : 'no'}">${r.uses_build_script ? 'Yes' : 'No'}</td>
    <td><div class="summary">${r.build_script_summary ? escapeHtml(r.build_script_summary) : ''}</div></td>
  </tr>`).join('');
}

document.getElementById('toggle').addEventListener('change', e => render(e.target.checked));
render(false);
